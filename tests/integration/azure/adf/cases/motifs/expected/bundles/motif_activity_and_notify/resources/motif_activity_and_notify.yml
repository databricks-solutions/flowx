resources:
  jobs:
    motif_activity_and_notify:
      name: motif-activity-and-notify
      tasks:
      - task_key: work
        notebook_task:
          notebook_path: ../src/notebooks/work.py
          base_parameters:
            wait_seconds: '1'
      - task_key: notify
        depends_on:
        - task_key: work
        run_if: ALL_DONE
        notebook_task:
          notebook_path: ../src/notebooks/notify.py
          base_parameters:
            url: https://example.invalid/notify
            method: POST
            body: ''
