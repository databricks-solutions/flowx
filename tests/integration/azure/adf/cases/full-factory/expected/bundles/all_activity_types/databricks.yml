bundle:
  name: all_activity_types
variables:
  catalog:
    description: Target catalog
    default: main
  schema:
    description: Target schema
    default: default
  child_pipeline_job_id:
    description: Numeric job ID for pipeline 'child_pipeline' (defined in a sibling
      bundle). Populate via `databricks bundle deploy --var "child_pipeline_job_id=<job_id>"`
      or set the default here.
include:
- resources/*.yml
sync:
  include:
  - src/**
targets:
  dev:
    mode: development
  staging:
    mode: production
  prod:
    mode: production
