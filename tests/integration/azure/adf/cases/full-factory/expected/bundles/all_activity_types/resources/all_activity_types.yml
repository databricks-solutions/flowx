resources:
  jobs:
    all_activity_types:
      name: all-activity-types
      tasks:
      - task_key: _init_status
        notebook_task:
          notebook_path: ../src/notebooks/init_status.py
          base_parameters:
            variable_name: status
            value: new
      - task_key: append-variable
        notebook_task:
          notebook_path: ../src/notebooks/append_variable.py
          base_parameters:
            variable_name: results
            source_task_key: ''
            value: ok
      - task_key: copy
        notebook_task:
          notebook_path: ../src/notebooks/copy.py
          base_parameters:
            source_type: DelimitedTextSource
            sink_type: ParquetSink
            source_path: ''
            target_table: ''
      - task_key: databricks-job
        run_job_task:
          job_id: '1'
      - task_key: delete
        notebook_task:
          notebook_path: ../src/notebooks/delete.py
          base_parameters:
            dataset_name: ''
            recursive: 'true'
            folder_path: ''
      - task_key: execute-child
        run_job_task:
          job_id: ${var.child_pipeline_job_id}
      - task_key: filter
        notebook_task:
          notebook_path: ../src/notebooks/filter.py
          base_parameters:
            items_expression: '{{job.parameters.items}}'
      - task_key: foreach
        for_each_task:
          inputs: '{{job.parameters.items}}'
          task:
            task_key: foreach-wait
            notebook_task:
              notebook_path: ../src/notebooks/foreach_wait.py
              base_parameters:
                wait_seconds: '1'
                item: '{{input}}'
          concurrency: 20
      - task_key: if-condition
        condition_task:
          op: EQUAL_TO
          left: '1'
          right: '1'
      - task_key: true-wait
        notebook_task:
          notebook_path: ../src/notebooks/true_wait.py
          base_parameters:
            wait_seconds: '1'
        depends_on:
        - task_key: if-condition
          outcome: 'true'
      - task_key: false-wait
        notebook_task:
          notebook_path: ../src/notebooks/false_wait.py
          base_parameters:
            wait_seconds: '1'
        depends_on:
        - task_key: if-condition
          outcome: 'false'
      - task_key: lookup
        notebook_task:
          notebook_path: ../src/notebooks/lookup.py
          base_parameters:
            first_row_only: 'true'
      - task_key: notebook
        existing_cluster_id: <DATABRICKS_CLUSTER_ID>
        notebook_task:
          notebook_path: /Shared/flowx/integration
      - task_key: set-variable
        notebook_task:
          notebook_path: ../src/notebooks/set_variable.py
          base_parameters:
            variable_name: status
            value: running
      - task_key: spark-jar
        existing_cluster_id: <DATABRICKS_CLUSTER_ID>
        spark_jar_task:
          main_class_name: com.example.Integration
      - task_key: spark-python
        existing_cluster_id: <DATABRICKS_CLUSTER_ID>
        spark_python_task:
          python_file: ../src/scripts/integration.py
      - task_key: switch_case_running
        condition_task:
          op: EQUAL_TO
          left: '{{tasks.set-variable.values.status}}'
          right: running
      - task_key: case-wait
        notebook_task:
          notebook_path: ../src/notebooks/case_wait.py
          base_parameters:
            wait_seconds: '1'
        depends_on:
        - task_key: switch_case_running
          outcome: 'true'
      - task_key: default-wait
        notebook_task:
          notebook_path: ../src/notebooks/default_wait.py
          base_parameters:
            wait_seconds: '1'
        depends_on:
        - task_key: switch_case_running
          outcome: 'false'
      - task_key: wait
        notebook_task:
          notebook_path: ../src/notebooks/wait.py
          base_parameters:
            wait_seconds: '1'
      - task_key: web
        notebook_task:
          notebook_path: ../src/notebooks/web.py
          base_parameters:
            url: https://example.invalid/flowx
            method: GET
      parameters:
      - name: items
        default: '["one"]'
      trigger:
        file_arrival:
          url: <STORAGE_ACCOUNT_ID>
        pause_status: PAUSED
