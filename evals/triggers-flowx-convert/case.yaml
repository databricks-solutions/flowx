schema_version: "1.1"
name: triggers-flowx-convert
description: The flowx-convert skill should trigger for a request it describes.
tags: [trigger, flowx-convert]
runs: 3
execution:
  prompt: "Run the flowx convert step on the discovered ADF inventory in ./flowx_output."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: flowx-convert-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flowx-convert"'
