schema_version: "1.1"
name: generalizes-airflow-migrate
description: A non-ADF source should still trigger flowx-migrate, so the skills don't over-index on ADF.
tags: [trigger, generalization, flowx-migrate]
runs: 3
execution:
  prompt: "Move our Apache Airflow DAGs in ./dags to Databricks Lakeflow Jobs."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: flowx-migrate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flowx-migrate"'
