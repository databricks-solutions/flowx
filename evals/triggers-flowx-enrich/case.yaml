schema_version: "1.1"
name: triggers-flowx-enrich
description: The flowx-enrich skill should trigger for a request it describes.
tags: [trigger, flowx-enrich]
runs: 3
execution:
  prompt: "Enrich the flowx inventory in ./flowx_output with agentic insights: recommend a Databricks pattern for each pipeline."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: flowx-enrich-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flowx-enrich"'
