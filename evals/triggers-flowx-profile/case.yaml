schema_version: "1.1"
name: triggers-flowx-profile
description: The flowx-profile skill should trigger for a request it describes.
tags: [trigger, flowx-profile]
runs: 3
execution:
  prompt: "What does our Azure Data Factory estate cost us? I want a TCO estimate before we migrate."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: flowx-profile-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flowx-profile"'
