schema_version: "1.1"
name: triggers-flowx-migrate
description: The flowx-migrate skill should trigger for a request it describes.
tags: [trigger, flowx-migrate]
runs: 3
execution:
  prompt: "Migrate my Azure Data Factory pipelines in /Volumes/main/default/adf_export to Databricks Lakeflow Jobs, end to end."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: flowx-migrate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flowx-migrate"'
