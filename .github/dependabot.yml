version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7
      exclude:
        - "databricks*"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/tests/integration/azure/terraform"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/.github/claude-code"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
